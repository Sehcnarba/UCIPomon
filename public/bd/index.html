<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Em Manutenção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f6f2;
      --surface: rgba(255,255,255,0.72);
      --text: #28251d;
      --muted: #6f6b64;
      --primary: #01696f;
      --border: rgba(40,37,29,0.1);
      --shadow: 0 18px 48px rgba(31, 27, 22, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(1,105,111,0.16), transparent 30%),
        radial-gradient(circle at bottom right, rgba(1,105,111,0.1), transparent 28%),
        linear-gradient(180deg, #fbfaf7 0%, var(--bg) 100%);
      font-family: 'Inter', sans-serif;
      color: var(--text);
    }

    main {
      width: min(100%, 760px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      text-align: center;
      padding: clamp(2rem, 6vw, 4.5rem);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.75rem 1rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--primary);
      box-shadow: 0 0 0 8px rgba(1,105,111,0.12);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4.75rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
      margin-bottom: 1rem;
    }

    p {
      font-size: clamp(1rem, 1rem + 0.2vw, 1.15rem);
      color: var(--muted);
      max-width: 36ch;
      margin: 0 auto 1.5rem auto;
    }

    a.back {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
    a.back:hover, a.back:focus-visible {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge"><span class="dot" aria-hidden="true"></span>Modo temporário</div>
    <h1>em Manutenção</h1>
    <p>Elsa, deixa de dar spoiler!</p>
    <a class="back" href="/">&larr; Voltar ao início</a>
  </main>
</body>
</html>
